name: Build AI LIVE GIRL

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: unzip -o AILiveGirl_Android_Prototype_0_2_CloudBuild.zip -d project

      - name: Build APK
        run: gradle -p project :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: AI-LIVE-GIRL-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
