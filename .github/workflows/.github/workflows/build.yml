name: Build AI LIVE GIRL

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: unzip -o AILiveGirl_Android_Prototype_0_2_CloudBuild.zip -d project

      - name: Build APK
        run: gradle -p project :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: AI-LIVE-GIRL-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
